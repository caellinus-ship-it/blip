<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blip look reference</title>
<style>
body{margin:0;padding:24px 16px;background:#0C0C14;color:#E8E8F0;font:14px -apple-system,system-ui,sans-serif}
main{max-width:680px;margin:0 auto}
.pk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.pk span{font-size:13px;color:#9A9AB0;width:64px}
.pk button{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid #3A3A50;background:transparent;color:#E8E8F0;cursor:pointer}
.pk button.on{border-color:#38BDF8;background:#0C3A52;color:#BAE6FD}
</style>
</head>
<body>
<main>
<p>Approved look reference (2026-11-17). A sketch of the feel, not code to port.</p>
<canvas id="cv" style="width:100%;display:block;border-radius:12px;image-rendering:pixelated"></canvas>
<div class="pk" data-k="trail"><span>Trail</span><button data-v="bolt" class="on">Lightning</button><button data-v="comet">Comet</button><button data-v="flame">Flame</button><button data-v="rings">Smoke rings</button><button data-v="echo">Echoes</button><button data-v="confetti">Confetti</button></div>
<div class="pk" data-k="color"><span>Color</span><button data-v="cyan" class="on">Cyan</button><button data-v="fire">Fire</button><button data-v="pink">Pink</button><button data-v="lime">Lime</button><button data-v="violet">Violet</button></div>
<div class="pk" data-k="creature"><span>Creature</span><button data-v="blob" class="on">Blob</button><button data-v="ghost">Ghost</button><button data-v="cat">Cat</button><button data-v="alien">Alien</button></div>
<div class="pk" data-k="ship"><span>Ship</span><button data-v="rocket" class="on">Rocket</button><button data-v="saucer">Saucer</button><button data-v="pod">Bubble pod</button><button data-v="star">Star ship</button></div>
<div class="pk"><span></span><button id="go">Launch again</button></div>
</main>
<script>
const S=3,W=680,H=380,K='#15151F',cv=document.getElementById('cv'),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
const CR={
blob:{c:'#6EE7B7',s:'#34B88A',h:'#D1FAE5',r:['....kkkkkkkk....','..kkXXXXXXXXkk..','.kXXhhXXXXXXXXk.','.kXhhXXXXXXXXXk.','kXXXXXXXXXXXXXXk','kXXXowXXXXowXXXk','kXXXooXXXXooXXXk','kXbbXXXmmXXXbbXk','kXXXXXXXXXXXXXXk','kXXXXXXXXXXXXXsk','.kXXXXXXXXXXXsk.','.kssXXXXXXXsssk.','..kkkkkkkkkkkk..']},
ghost:{c:'#C4B5FD',s:'#8B7BD8',h:'#F5F3FF',wg:1,r:['....kkkkkkkk....','..kkXXXXXXXXkk..','.kXXhhXXXXXXXXk.','.kXhhXXXXXXXXXk.','kXXXXXXXXXXXXXXk','kXXXowXXXXowXXXk','kXXXooXXXXooXXXk','kXXXXXXmmXXXXXXk','kXXXXXXmmXXXXXXk','kXXXXXXXXXXXXXsk','kXXXXXXXXXXXXssk','kXXkkXXXkkXXXkXk','.kk..kkk..kkk.k.']},
cat:{c:'#FDBA74',s:'#D98B3F',h:'#FFEDD5',r:['.kk..........kk.','kXXk........kXXk','kXbXkkkkkkkkXbXk','kXXXXXXXXXXXXXXk','kXXhXXXXXXXXXXXk','kXXXowXXXXowXXXk','kXXXooXXXXooXXXk','kXXXXXXppXXXXXXk','kwwXXXmXXmXXXwwk','kXXXXXXXXXXXXXsk','.kXXXXXXXXXXXsk.','.kssXXXXXXXsssk.','..kkkkkkkkkkkk..']},
alien:{c:'#7DD3FC',s:'#3BA4D4',h:'#E0F2FE',wg:1,r:['.......aa.......','.......kk.......','...kkkkXXkkkk...','..kXXXXXXXXXXk..','.kXhhXXXXXXXXXk.','.kXhXXkkkkXXXXk.','kXXXXkwwookXXXXk','kXXXXkwoookXXXXk','kXXXXXkkkkXXXXXk','kXbXXXXmmXXXXbXk','.kXXXXXXXXXXXsk.','..kXkkXkkXkkXk..','..kk..kk..kk.k..']}};
const SH={
rocket:['..kkkkkkkkkkkkkkkkkkkk..','.kHLLHHHHHHHHHHHHHHHDDk.','.kHLHHHHHHHHHHHHHHHHDDk.','.kRRRRRRRRRRRRRRRRRRRRk.','kkHLHHHHHHHHHHHHHHHHDDkk','kRkHHHHHoHHHHoHHHHHDDkRk','kRRkHHHHHHHHHHHHHHDDkRRk','kRRRkkkkkkkkkkkkkkkkRRRk','kkkk...kTTk..kTTk...kkkk'],
saucer:['....kkkkkkkkkkkkkkkk....','..kkHLLHHHHHHHHHHHHDkk..','kkHLLHHHHHHHHHHHHHHHHDkk','kRRyRRyRRyRRyRRyRRyRRyRk','kkHHHHHHHHHHHHHHHHHHDDkk','..kkDDDDDDDDDDDDDDDDkk..','....kkTTkk....kkTTkk....'],
pod:['.kkkkkkkkkkkkkkkkkkkkkk.','kHLLHHHHHHHHHHHHHHHHHDDk','kRRRRRRRRRRRRRRRRRRRRRRk','.kHHHHHHHHHHHHHHHHHHDDk.','..kkDDDDDDDDDDDDDDDDkk..','......kkTTTTTTTTkk......'],
star:['k......kkkkkkkkkk......k','kk...kkHLLHHHHHHDkk...kk','kRk.kHHLHHHHHHHHHDDk.kRk','kRRkHHHHHHHHHHHHHHDDkRRk','kRRRkRRRRRRRRRRRRRRkRRRk','kRRkkkHHHHHHHHHHHHkkkRRk','kkk...kkDDDDDDDDkk...kkk','........kTTk.kTTk.......']};
const CF=[['.X.X.','XXXXX','XXXXX','.XXX.','..X..'],['..X..','XXXXX','.XXX.','.X.X.','X...X'],['..X..','.XXX.','XXXXX','.XXX.','..X..']];
const COL={fire:['#FDE047','#FB923C','#B91C1C'],pink:['#FBCFE8','#F472B6','#9D174D'],cyan:['#CFFAFE','#22D3EE','#155E75'],lime:['#ECFCCB','#A3E635','#3F6212'],violet:['#EDE9FE','#A78BFA','#4C1D95']};
const st={creature:'blob',ship:'rocket',trail:'bolt',color:'cyan'};let t0=performance.now(),P=[],B=[[],[],[]],bl=36,n=0;
const sn=v=>Math.round(v/S)*S,rnd=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)};
function spr(rows,x,y,m,mono,dz){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(k==='.'||(dz&&(i+j)%2))continue;g.fillStyle=mono||m[k];g.fillRect(x+i*S,y+j*S,S,S)}})}
function rr(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function chat(t){
if(t<1.8)return;const x=330;g.font='13px sans-serif';g.textBaseline='middle';
rr(456,104,196,32,12,'#3B82F6');g.fillStyle='#FFFFFF';g.fillText("What's this error mean?",470,120);
if(t>2.5&&t<3.9){rr(x,146,60,30,12,'#2E2E3E');for(let i=0;i<3;i++){g.fillStyle=Math.floor(t*4)%3===i?'#FFFFFF':'#7C7C92';g.fillRect(x+16+i*12,159,4,4)}}
if(t>=3.9){rr(x,146,238,50,12,'#2E2E3E');g.fillStyle='#F4F4F8';g.fillText('Missing semicolon on line 12.',x+14,162);g.fillText('Add one after the bracket.',x+14,180)}
rr(x,222,322,36,12,'#1F1F2C');g.strokeStyle='#4A4A60';g.lineWidth=1;g.beginPath();g.roundRect(x+.5,222.5,321,35,12);g.stroke();
g.fillStyle='#8A8AA0';g.fillText('Ask Blip',x+14,240);g.fillStyle='#C8C8D8';g.fillRect(x+296,230,8,12);g.fillRect(x+292,238,4,4);g.fillRect(x+304,238,4,4);g.fillRect(x+292,242,16,4);g.fillRect(x+298,246,4,6)}
function trail(x,y,ey,fly,R,fr,sh){
P=P.filter(p=>p.a<p.l);const T=st.trail,ci=f=>R[Math.min(3,Math.floor(f*4))];
if(T==='comet'){P.push({x,y:ey,a:0,l:fly?46:28});for(const p of P){p.a++;p.y+=fly?3:1.5;const f=p.a/p.l;if(f>.65&&p.a%2)continue;const w=[9,7,5,3,1][Math.min(4,Math.floor(f*5))];g.fillStyle=ci(f);g.fillRect(p.x-Math.floor(w/2)*S,sn(p.y),w*S,S);if(f<.3){g.fillStyle='#FFFFFF';g.fillRect(p.x-S,sn(p.y),3*S,S)}}}
else if(T==='flame'){const q=Math.floor(n/3),len=(fly?18:6)+Math.floor(rnd(q,1)*4);for(let j=0;j<len;j++){const f=j/len,w=Math.max(1,Math.round((1-f)*7)+(rnd(q,j)>.6?1:0)),o=Math.round((rnd(q,j+50)-.5)*f*4);g.fillStyle=ci(f);g.fillRect(x+(o-Math.ceil(w/2))*S,ey+j*S,w*S,S);if(f<.45&&w>3){g.fillStyle='#FFFFFF';g.fillRect(x+(o-Math.ceil(w/2)+2)*S,ey+j*S,(w-4)*S,S)}}
for(let i=0;i<5;i++){g.fillStyle=R[2];g.fillRect(sn(x+(rnd(q,i+90)-.5)*54),sn(ey+rnd(q,i+70)*len*S),S,S)}}
else if(T==='rings'){if(n%(fly?8:26)===0)P.push({x,y:ey,a:0,l:44});for(const p of P){p.a++;p.y+=fly?2.2:1.2;const f=p.a/p.l,rx=8+p.a*.9,N=Math.ceil(6.283*rx/S);g.fillStyle=ci(f);for(let k=0;k<N;k++){if(f>.5&&k%2)continue;const an=k/N*6.283;g.fillRect(sn(p.x+Math.cos(an)*rx),sn(p.y+Math.sin(an)*rx*.4),S,S)}}}
else if(T==='echo'){if(n%4===0)P.push({x,y,a:0,l:24});for(const p of P){p.a++;if(!fly)p.y+=1.6;const f=p.a/p.l,c=R[Math.min(3,1+Math.floor(f*3))];spr(fr,p.x-24,sn(p.y)-33,null,c,f>.3);spr(sh,p.x-36,sn(p.y),null,c,f>.3)}}
else if(T==='bolt'){bl+=((fly?36:15)-bl)*.035;
for(let b=0;b<3;b++){if((n+b)%3===0||!B[b].length){const dir=b-1,len=Math.round(bl*(b===1?1:.72));let o=dir*4;B[b]=[];for(let j=0;j<len;j++){o+=Math.round((Math.random()-.5)*2.6+dir*.45);B[b].push(o)}}
const A=B[b],L=A.length;A.forEach((o,j)=>{const f=j/L;if(f>.82&&j%2)return;const w=b===1?(f>.6?2:3):(f>.5?1:2);g.fillStyle=R[Math.min(3,1+Math.floor(f*3))];g.fillRect(x+(o-(w>2?1:0))*S,ey+j*S,w*S,S);if(j%6===3&&f<.8)g.fillRect(x+(o+(rnd(j,b)>.5?w:-2))*S,ey+(j+1)*S,2*S,S);if(f<(b===1?.55:.3)){g.fillStyle='#FFFFFF';g.fillRect(x+o*S,ey+j*S,S,S)}})}
if(n%4<2){g.fillStyle='#FFFFFF';g.fillRect(x-5*S,ey,10*S,S)}}
else{if(fly?n%2===0:n%9===0)P.push({x:x+(Math.random()-.5)*36,y:ey,vx:(Math.random()-.5)*2.4,vy:fly?1.5+Math.random()*2:1+Math.random(),a:0,l:fly?60:36,k:Math.floor(Math.random()*3),i:Math.floor(Math.random()*3)});
for(const p of P){p.a++;p.x+=p.vx+Math.sin((p.a+p.i*9)/6)*.8;p.y+=p.vy;if(p.a/p.l>.7&&n%2)continue;spr(CF[p.k],sn(p.x),sn(p.y),null,['#FFFFFF',R[1],R[2]][p.i])}}}
function frame(now){
const t=(now-t0)/1000,c=CR[st.creature],sh=SH[st.ship],R=['#FFFFFF'].concat(COL[st.color]);n++;
g.fillStyle='#12121C';g.fillRect(0,0,W,H);
g.fillStyle='#1A1A28';g.fillRect(24,28,290,200);g.fillRect(370,70,286,270);g.fillStyle='#222234';g.fillRect(24,28,290,16);g.fillRect(370,70,286,16);
let x=200,y,fly=t<1.5;
if(fly){const k=1-Math.pow(1-t/1.5,3);y=H+90-(H+90-190)*k}else{const h=(t-1.5)*1.3;x=200+18*Math.sin(h);y=190+9*Math.sin(2*h)}
x=sn(x);y=sn(y);const tick=Math.floor(t*3),by=(Math.floor(t*2)%2)*S;
let fr=c.r;if(c.wg&&tick%2){fr=c.r.slice(0,-1);fr.push('.'+c.r[c.r.length-1].slice(0,-1))}
trail(x,y,y+sh.length*S,fly,R,fr,sh);
for(let i=0;i<20;i++){if((i+tick)%2)continue;const an=i/20*6.283;g.fillStyle=c.h;g.fillRect(sn(x+Math.cos(an)*46),sn(y-12+Math.sin(an)*40),S,S)}
for(let i=0;i<12;i++){if((i+tick+1)%2)continue;const an=i/12*6.283+.3;g.fillStyle=c.c;g.fillRect(sn(x+Math.cos(an)*56),sn(y-12+Math.sin(an)*50),S,S)}
const bk=tick%10===0;
spr(fr,x-24,y-33-by,{k:K,X:c.c,s:c.s,h:c.h,o:bk?c.s:K,w:bk?c.c:'#FFFFFF',b:'#FB7185',m:K,p:'#F472B6',a:'#FDE047'});
if(st.ship==='pod'){for(let i=0;i<=26;i++){const an=3.1416+i/26*3.1416;g.fillStyle='#BAE6FD';g.fillRect(sn(x+Math.cos(an)*33),sn(y+Math.sin(an)*45),S,S);if(i>4&&i<9){g.fillStyle='#FFFFFF';g.fillRect(sn(x+Math.cos(an)*28),sn(y+Math.sin(an)*39),S,S)}}}
spr(sh,x-36,y,{k:K,H:'#E8EAF0',L:'#FFFFFF',D:'#9AA1B2',R:R[2],T:'#3A3F52',o:'#5B6378',y:tick%2?'#FDE047':'#FFFFFF'});
chat(t);requestAnimationFrame(frame)}
const reset=()=>{t0=performance.now();P=[];B=[[],[],[]];bl=36};
document.querySelectorAll('.pk[data-k]').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{row.querySelectorAll('button').forEach(o=>o.classList.remove('on'));b.classList.add('on');st[row.dataset.k]=b.dataset.v;reset()}));
document.getElementById('go').onclick=reset;
requestAnimationFrame(frame);
</script>
</body>
</html>
